# Builds SpookyLite.exe with PyInstaller and attaches it to a GitHub Release.
#
# Release:  git tag v1.0.0 && git push origin v1.0.0
# Test run: Actions tab -> "Build Windows release" -> Run workflow
#           (builds the .exe as a downloadable artifact, no release created)

name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release and upload the .exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm SpookyLite.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpookyLite
          path: dist/SpookyLite.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpookyLite.exe
          generate_release_notes: true
